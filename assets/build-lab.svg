<g font-family="ui-monospace, Consolas, monospace"><text x="48" y="52" fill="#48e4dc" font-size="14" letter-spacing="3">KALEAB-Y / BUILD LAB</text><text x="48" y="130" fill="#f0f6fc" font-size="52" font-weight="700">Kaleab Yohannes</text><text x="50" y="172" fill="#b9c6d9" font-size="21">Interfaces. APIs. Mobile. AI.</text><rect x="48" y="203" width="565" height="76" rx="10" fill="#07101d" stroke="#2e3a53"/><circle cx="68" cy="222" r="4" fill="#ff7b72"/><circle cx="83" cy="222" r="4" fill="#e3b341"/><circle cx="98" cy="222" r="4" fill="#3fb950"/><text x="67" y="256" fill="#48e4dc" font-size="17">&gt; turn ideas into working software</text><rect x="474" y="241" width="9" height="18" fill="#b794f6"><animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/></rect></g><rect x="48" y="303" width="904" height="3" rx="2" fill="url(#accent)"/>
