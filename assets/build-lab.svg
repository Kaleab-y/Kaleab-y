<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Kaleab Yohannes — Build Lab</title><desc id="desc">Software developer. Web, mobile, APIs and AI. Animated cyan signals travel through a violet circuit board.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#1b1234"/></linearGradient><linearGradient id="accent"><stop stop-color="#48e4dc"/><stop offset="1" stop-color="#b794f6"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern></defs>
<rect width="1000" height="330" rx="20" fill="url(#bg)"/><rect width="1000" height="330" rx="20" fill="url(#grid)"/>
<g fill="none" stroke="#624984" stroke-width="2"><path id="route" d="M690 75H760V135H865V230H960"/><path d="M680 270H725V215H805V100H965"/><path d="M850 45V80H915V170H985"/></g>
