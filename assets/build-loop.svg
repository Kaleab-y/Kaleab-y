<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-labelledby="title desc">
  <title id="title">Kaleab's build loop</title>
  <desc id="desc">Explore, design, build, test, refine. A moving terracotta signal connects each stage.</desc>
  <rect width="1000" height="110" rx="6" fill="#161B22" stroke="#30363D"/>
  <!-- Connecting line -->
  <path d="M120 46H880" stroke="#30363D" stroke-width="2"/>
  <path d="M120 46H880" stroke="#30363D" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Stages -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle" fill="#C9D1D9">
    <!-- Explore -->
    <circle cx="120" cy="46" r="14" fill="#161B22" stroke="#749B93" stroke-width="2"/>
    <circle cx="120" cy="46" r="4" fill="#749B93"/>
    <text x="120" y="84">EXPLORE</text>
    
    <!-- Design -->
    <circle cx="310" cy="46" r="14" fill="#161B22" stroke="#E58550" stroke-width="2"/>
    <circle cx="310" cy="46" r="4" fill="#E58550"/>
    <text x="310" y="84">DESIGN</text>
    
    <!-- Build -->
    <circle cx="500" cy="46" r="14" fill="#161B22" stroke="#749B93" stroke-width="2"/>
    <circle cx="500" cy="46" r="4" fill="#749B93"/>
    <text x="500" y="84">BUILD</text>
    
    <!-- Test -->
    <circle cx="690" cy="46" r="14" fill="#161B22" stroke="#E58550" stroke-width="2"/>
    <circle cx="690" cy="46" r="4" fill="#E58550"/>
    <text x="690" y="84">TEST</text>
    
    <!-- Refine -->
    <circle cx="880" cy="46" r="14" fill="#161B22" stroke="#749B93" stroke-width="2"/>
    <circle cx="880" cy="46" r="4" fill="#749B93"/>
    <text x="880" y="84">REFINE</text>
  </g>
  <!-- Moving terracotta signal -->
  <circle r="5" fill="#E58550">
    <animateMotion dur="6s" repeatCount="indefinite" path="M120 46H880"/>
  </circle>
</svg>