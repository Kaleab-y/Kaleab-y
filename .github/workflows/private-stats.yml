name: Refresh aggregate profile stats
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate aggregate SVG cards
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 scripts/generate_private_stats.py
      - name: Save updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/private-stats.svg assets/private-languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'profile: refresh aggregate stats'
          git push
